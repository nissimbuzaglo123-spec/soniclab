name: mirror-assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets from manifest
        run: |
          set -e
          jq -c '.[]' assets-manifest.json | while read -r item; do
            url=$(echo "$item" | jq -r .url)
            path=$(echo "$item" | jq -r .path)
            mkdir -p "$(dirname "$path")"
            echo "Fetching $path"
            curl -sSL --retry 3 -o "$path" "$url"
          done

      - name: Commit mirrored assets
        run: |
          git config user.name "asset-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Mirror generated assets from CDN"
          git push
